name: release

# world_assets.zip - world_assets/<pack>.pck, unzipped into the game directory - built by `make
# packs` and published: main's newest as the one prerelease MAIN_RELEASE, replaced on every push
# to main; a pushed tag as a release of its own, named by the tag, the latest.
# The packs build with no libmaszyna: what their files need is gnd-biomes (GND_BIOMES_REF of
# GamesNotDeveloped/godot-biomes) and Terrain3D with the terrain streamer (reloaded-terrain's release,
# make terrain3d), run by the double precision Godot of libmaszyna's release (LIBMASZYNA_REF's
# ci/fetch-godot.sh).
on:
  push:
    branches:
      - main
    tags:
      - '**'
      # made by the CI itself (a tag it makes starts no workflow anyway)
      - '!world-assets-main'
  workflow_dispatch:

env:
  # gnd-biomes, whose scripts the biomes' files name: the commit the game has
  GND_BIOMES_REF: 429165b8e9a592b73ba4058064aea31051edc86c
  # the libmaszyna whose engine builds the packs (its GODOT_VERSION, the game's)
  LIBMASZYNA_REF: feat/world-pck
  # main's release, replaced on every push to main
  MAIN_RELEASE: world-assets-main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: true

      - name: Checkout gnd-biomes
        uses: actions/checkout@v6
        with:
          repository: GamesNotDeveloped/godot-biomes
          ref: ${{ env.GND_BIOMES_REF }}
          path: godot-biomes

      - name: Checkout libmaszyna's engine fetching
        uses: actions/checkout@v6
        with:
          repository: MaSzyna-Reloaded/libmaszyna
          ref: ${{ env.LIBMASZYNA_REF }}
          path: libmaszyna
          sparse-checkout: |
            ci
            Makefile
          sparse-checkout-cone-mode: false

      - name: Fetch the double precision Godot
        run: |
          libmaszyna/ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the packs
        run: make packs GND_BIOMES="$PWD/godot-biomes" GODOT=godot-double PACKS_OUT="$PWD/dist"

      - name: Publish the tag's release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/world_assets.zip --verify-tag --title "$GITHUB_REF_NAME" --latest \
            --notes "world_assets/<pack>.pck of $GITHUB_REF_NAME: unzip into the game directory."

      - name: Publish main's release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$MAIN_RELEASE" --cleanup-tag --yes || true
          gh release create "$MAIN_RELEASE" dist/world_assets.zip --target "$GITHUB_SHA" --prerelease \
            --title "$MAIN_RELEASE" --notes "world_assets/<pack>.pck of main at ${GITHUB_SHA::7}: unzip into the game directory."
