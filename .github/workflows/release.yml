name: release

# world_assets.zip - world_assets/<pack>.pck, unzipped into the game directory - built by `make
# packs` and published: main's newest as the one prerelease MAIN_RELEASE, replaced on every push
# to main; a pushed tag as a release of its own, named by the tag, the latest.
# The packs build with no libmaszyna: what their files need is the game's (GAME_REF) gnd-biomes and
# its double precision Terrain3D (its `make terrain3d`: patched, against libmaszyna's godot-cpp and
# the engine's API dumped by libmaszyna's Makefile), run by the double precision Godot of
# libmaszyna's release (ci/fetch-godot.sh), as the game's CI fetches it.
on:
  push:
    branches:
      - main
    tags:
      - '**'
      # made by the CI itself (a tag it makes starts no workflow anyway)
      - '!world-assets-main'
  workflow_dispatch:

env:
  # the game's branch whose vendor/ (gnd-biomes, Terrain3D) and patches/ the packs are built with
  GAME_REF: feat/world-pck
  # main's release, replaced on every push to main
  MAIN_RELEASE: world-assets-main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: true

      - name: Checkout the game
        uses: actions/checkout@v6
        with:
          repository: MaSzyna-Reloaded/maszyna-reloaded
          ref: ${{ env.GAME_REF }}
          path: game
          submodules: recursive

      - name: Fetch the double precision Godot
        run: |
          game/vendor/libmaszyna/ci/fetch-godot.sh godot.linuxbsd.editor.double.x86_64
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Terrain3D's libraries, built again only when its sources, its patches or the godot-cpp
      # they are built against change
      - name: Terrain3D's sources
        id: terrain3d
        run: |
          echo "key=terrain3d-$(git -C game rev-parse HEAD:vendor/terrain3d)-$(git -C game/vendor/libmaszyna rev-parse HEAD:godot-cpp)-${{ hashFiles('game/patches/terrain3d-*.patch') }}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: terrain3d-cache
        with:
          path: game/vendor/terrain3d/project/addons/terrain_3d/bin
          key: ${{ steps.terrain3d.outputs.key }}

      - name: Build Terrain3D
        if: steps.terrain3d-cache.outputs.cache-hit != 'true'
        run: |
          pipx install scons
          make -C game/vendor/libmaszyna "$PWD/game/vendor/libmaszyna/extension_api.json" GODOT=godot-double
          make -C game terrain3d

      - name: Build the packs
        run: make packs GAME="$PWD/game" GODOT=godot-double PACKS_OUT="$PWD/dist"

      - name: Publish the tag's release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/world_assets.zip --verify-tag --title "$GITHUB_REF_NAME" --latest \
            --notes "world_assets/<pack>.pck of $GITHUB_REF_NAME: unzip into the game directory."

      - name: Publish main's release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$MAIN_RELEASE" --cleanup-tag --yes || true
          gh release create "$MAIN_RELEASE" dist/world_assets.zip --target "$GITHUB_SHA" --prerelease \
            --title "$MAIN_RELEASE" --notes "world_assets/<pack>.pck of main at ${GITHUB_SHA::7}: unzip into the game directory."
